# Bob (github.com/badcodetv/bob) on the box. Images from Artifact Registry repo `bob` at ${TAG}
# (release.env). Secrets in .env.box (box only, gitignored, never committed).
#
# This repository owns its own deployment now (design/2026-09-28-foundation-plan.md, Decision 15):
# this file, deploy/env.example and ./stack deploy <tag> replace the compose file the ops
# repository used to generate. This file only NAMES variables — it is public —
# so every secret it names must be set in .env.box or the box API/project container never sees it.
#
# Bob does NOT start containers and has NO Docker socket. Each project has a service of its own,
# declared by hand below (Decision 4: BOB_PROJECTS, one BOB_RUNTIME_TOKEN_<NAME> per project). Bob
# reaches them by name on the bob-projects network, which joins nothing else: no Postgres, and
# apps on 127.0.0.1 are out of reach.
#
# Postgres is Bob's own (ops design/2026-10-19-every-app-brings-its-own-postgres.md): the
# `postgres` service below, on the `db` network that only the API joins. Its image tag is pinned
# here and is never ${TAG}, and it reads no env_file, so a deploy of a new Bob does not restart it.
name: bob

services:
  postgres:
    image: europe-west1-docker.pkg.dev/webkit-servers/bob/postgres:18.6-2
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${BOB_PG_SUPERUSER_PASSWORD:?}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      BOB_DB_PASSWORD: ${BOB_DB_PASSWORD:?}     # app_bob's; read only on the first start (initdb)
    # Settings are flags rather than a mounted file, so ./stack deploy still copies one file.
    # archive_command ships every change to Google Cloud Storage within archive_timeout; the stanza
    # [bob] lives in the box's /etc/pgbackrest/pgbackrest.conf (ops/apps/postgres/backup).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - huge_pages=try
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=pgbackrest --stanza=bob archive-push %p
      - -c
      - max_wal_size=4GB
      - -c
      - wal_compression=zstd
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1s
      - -c
      - log_checkpoints=on
    volumes:
      - /srv/apps/bob/pgdata:/var/lib/postgresql
      - /srv/backup/spool:/srv/backup/spool
      - /etc/pgbackrest:/etc/pgbackrest:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [db]
    mem_limit: 8g
    stop_grace_period: 2m

  api:
    image: europe-west1-docker.pkg.dev/webkit-servers/bob/api:${TAG:?run ./stack deploy <tag>}
    restart: unless-stopped
    # Named one by one rather than `env_file: .env.box`, which would hand the API every project's
    # credentials as well. Bob does not run agents and has no use for them; only the project
    # containers do, and each gets only what its own environment names.
    environment:
      BOB_DATABASE_URL: ${BOB_DATABASE_URL:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      BOB_SESSION_SECRET: ${BOB_SESSION_SECRET:?}
      BOB_PROJECT_MAP: ${BOB_PROJECT_MAP:?}
      BOB_PUBLIC_URL: ${BOB_PUBLIC_URL:?}
      BOB_PROJECTS: enc,marketing,wolf
      BOB_RUNTIME_TOKEN_ENC: ${BOB_RUNTIME_TOKEN_ENC:?}
      BOB_RUNTIME_TOKEN_MARKETING: ${BOB_RUNTIME_TOKEN_MARKETING:?}
      BOB_RUNTIME_TOKEN_WOLF: ${BOB_RUNTIME_TOKEN_WOLF:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}  # memory embeddings (T21); the API will not start without it
      BOB_EMBEDDING_MODEL: ${BOB_EMBEDDING_MODEL:-}  # optional; empty = text-embedding-3-small
      # Not `:?required`: a project with no BOB_DRIVE_TOKEN_<NAME> set is fine (T14) — the api
      # must start with these empty for a box with no Drive project configured yet. Required
      # only once some BOB_DRIVE_TOKEN_<NAME> is set (main.go is fatal in that case if these
      # are empty).
      BOB_ATTENTION_WEBHOOK_ENC: ${BOB_ATTENTION_WEBHOOK_ENC:-}  # optional; empty = no webhook (T23)
      BOB_ATTENTION_WEBHOOK_MARKETING: ${BOB_ATTENTION_WEBHOOK_MARKETING:-}
      BOB_ATTENTION_WEBHOOK_WOLF: ${BOB_ATTENTION_WEBHOOK_WOLF:-}
      BOB_DRIVE_CLIENT_ID: ${BOB_DRIVE_CLIENT_ID:-}
      BOB_DRIVE_CLIENT_SECRET: ${BOB_DRIVE_CLIENT_SECRET:-}
      BOB_DRIVE_TOKEN_ENC: ${BOB_DRIVE_TOKEN_ENC:-}
      BOB_DRIVE_TOKEN_MARKETING: ${BOB_DRIVE_TOKEN_MARKETING:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db, bob-projects]
    ports:
      - "127.0.0.1:8100:8070"              # Caddy only
    mem_limit: 1g

  bob-project-enc:
    image: europe-west1-docker.pkg.dev/webkit-servers/bob/runtime:${TAG:?run ./stack deploy <tag>}
    container_name: bob-project-enc
    init: true
    restart: unless-stopped
    environment:
      BOB_PROJECT_NAME: enc
      BOB_RUNTIME_TOKEN: ${BOB_RUNTIME_TOKEN_ENC:?}
      BOB_API_URL: http://api:8070
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?}
      GITHUB_TOKEN: ${GITHUB_TOKEN_ENC:?}
    volumes:
      - bob-project-enc:/project
    networks: [bob-projects]
    mem_limit: 8g
    pids_limit: 4096
    stop_grace_period: 10m

  bob-project-marketing:
    image: europe-west1-docker.pkg.dev/webkit-servers/bob/runtime:${TAG:?run ./stack deploy <tag>}
    container_name: bob-project-marketing
    init: true
    restart: unless-stopped
    environment:
      BOB_PROJECT_NAME: marketing
      BOB_RUNTIME_TOKEN: ${BOB_RUNTIME_TOKEN_MARKETING:?}
      BOB_API_URL: http://api:8070
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?}
      GITHUB_TOKEN: ${GITHUB_TOKEN_MARKETING:?}
    volumes:
      - bob-project-marketing:/project
    networks: [bob-projects]
    mem_limit: 8g
    pids_limit: 4096
    stop_grace_period: 10m

  bob-project-wolf:
    image: europe-west1-docker.pkg.dev/webkit-servers/bob/runtime:${TAG:?run ./stack deploy <tag>}
    container_name: bob-project-wolf
    init: true
    restart: unless-stopped
    environment:
      BOB_PROJECT_NAME: wolf
      BOB_RUNTIME_TOKEN: ${BOB_RUNTIME_TOKEN_WOLF:?}
      BOB_API_URL: http://api:8070
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?}
      GITHUB_TOKEN: ${GITHUB_TOKEN_WOLF:?}
      FRED_API_KEY: ${FRED_API_KEY:?}
    volumes:
      - bob-project-wolf:/project
    networks: [bob-projects]
    mem_limit: 8g
    pids_limit: 4096
    stop_grace_period: 10m

networks:
  db: {}                                   # Bob's API and Bob's Postgres, nothing else
  bob-projects:
    external: true

volumes:
  bob-project-enc:
    external: true
  bob-project-marketing:
    external: true
  bob-project-wolf:
    external: true
